name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux binary
        run: GOOS=linux GOARCH=amd64 go build -o dist/codium-installer-linux-amd64 .

      - name: Build Windows binary
        run: GOOS=windows GOARCH=amd64 go build -o dist/codium-installer-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/codium-installer-linux-amd64
            dist/codium-installer-windows-amd64.exe
